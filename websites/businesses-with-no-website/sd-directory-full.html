<style>
:root{--ground:#F4F6F5;--panel:#FFFFFF;--ink:#0C2430;--ink-soft:#4A5F69;--line:#D9E0DE;--accent:#12707F;--on-accent:#FFFFFF;--bad:#9C2F3B;color-scheme:light}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;

p{margin:0;color:var(--ink-soft);font-size:14px}

input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft)}

#msg{min-height:1.4em;font-size:14px;color:var(--bad)}
</style>

const KEY_STORE = "page-lock.key." + P.s;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(key){
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.c));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html = await new Response(stream).text();
  for (const src of P.js) {
    await new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = src; s.onload = ok; s.onerror = () => fail(new Error("script " + src));
      document.head.appendChild(s);
    });
  }
  document.open(); document.write(html); document.close();
}
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: b64(P.s), iterations: P.it},
    base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (!saved) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
    await open(key);
  } catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (e2) {} }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "Unlocking…"; msg.textContent = "";
  try {
    const key = await derive(document.getElementById("pw").value);
    if (document.getElementById("remember").checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      try { localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw))); } catch (e2) {}
    }
    await open(key);
  } catch (err) {
    btn.disabled = false; btn.textContent = "Unlock";
    msg.textContent = err && err.name === "OperationError" ? "Wrong password. Try again." : "This browser can't open the page. Update it, or try Chrome or Safari.";
  }
});
