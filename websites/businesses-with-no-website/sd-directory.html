<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>No-Site Register</title>
<style>
:root{--ground:#F4F6F5;--panel:#FFFFFF;--ink:#0C2430;--ink-soft:#4A5F69;--line:#D9E0DE;--accent:#12707F;--on-accent:#FFFFFF;--bad:#9C2F3B;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--ground:#0A1A22;--panel:#10242E;--ink:#E8F0F1;--ink-soft:#9DB2B9;--line:#22404C;--accent:#4FC3CE;--on-accent:#06222A;--bad:#F2A3AC;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:var(--ground);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}
h1 span{color:var(--accent)}
p{margin:0;color:var(--ink-soft);font-size:14px}
input[type=password]{font:inherit;font-size:17px;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft)}
button{font:inherit;font-weight:600;font-size:15px;color:var(--on-accent);background:var(--accent);border:0;border-radius:10px;padding:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.4em;font-size:14px;color:var(--bad)}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>No-Site Register<span>.</span></h1>
  <p>This page is private. Enter the password to open it.</p>
  <input type="text" name="username" value="no-site-finder" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Password" required autofocus>
  <label><input type="checkbox" id="remember" checked> Remember on this device</label>
  <button type="submit" id="go">Unlock</button>
  <div id="msg" role="alert"></div>
</form>

const KEY_STORE = "page-lock.key." + P.s;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(key){
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.c));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html = await new Response(stream).text();
  for (const src of P.js) {
    await new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = src; s.onload = ok; s.onerror = () => fail(new Error("script " + src));
      document.head.appendChild(s);
    });
  }
  document.open(); document.write(html); document.close();
}
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: b64(P.s), iterations: P.it},
    base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (!saved) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
    await open(key);
  } catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (e2) {} }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "Unlocking…"; msg.textContent = "";
  try {
    const key = await derive(document.getElementById("pw").value);
    if (document.getElementById("remember").checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      try { localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw))); } catch (e2) {}
    }
    await open(key);
  } catch (err) {
    btn.disabled = false; btn.textContent = "Unlock";
    msg.textContent = err && err.name === "OperationError" ? "Wrong password. Try again." : "This browser can't open the page. Update it, or try Chrome or Safari.";
  }
});
